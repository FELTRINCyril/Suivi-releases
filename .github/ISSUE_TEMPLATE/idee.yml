name: Proposer une idée ou une amélioration
description: Une fonction qui manque, quelque chose à rendre plus simple.
title: "[Idée] "
labels: ["idee"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Ce message sera public.** Tout le monde peut lire les issues de ce dépôt.
        > N'y mettez rien de personnel : ni mot de passe, ni note privée, ni habitude que vous ne
        > voulez pas rendre publique.

  - type: textarea
    id: idee
    attributes:
      label: Votre idée
      description: Ce que vous aimeriez pouvoir faire dans Suivi.
    validations:
      required: true

  - type: textarea
    id: pourquoi
    attributes:
      label: Pourquoi
      description: Dans quelle situation cela vous servirait, et comment vous faites aujourd'hui.
    validations:
      required: false

  - type: input
    id: version-suivi
    attributes:
      label: Version de Suivi (facultatif)
      description: Dans Suivi, Réglages > Version.
      placeholder: "1.0"
    validations:
      required: false

  - type: checkboxes
    id: confidentialite
    attributes:
      label: Confidentialité
      options:
        - label: Je n'ai mis aucune information personnelle dans ce message.
          required: true
